<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SGT</title><link rel="icon" type="image/svg+xml" th:href="@{/logo.svg}"><link rel="stylesheet" th:href="@{/style.css}"></head>
<body th:attr="data-agora=${agora}">
<header th:replace="~{fragmentos :: topo(${pagina})}"></header>
<main>
<div class="pagina-titulo"><h1>Agenda do dia</h1><p>Suas tarefas de hoje organizadas por turno. Use os ícones para mover uma tarefa de turno.</p></div>
<div th:replace="~{fragmentos :: aviso}"></div>
<div th:replace="~{fragmentos :: faixaFoco}"></div>
<div class="cols">
  <div class="card" th:each="c : ${colunas}">
    <div class="ph">
      <h2><span class="dot" th:style="${'background:' + c.periodo().cor}"></span><span th:text="${c.periodo().rotulo}"></span></h2>
      <span class="mu" th:text="${c.tarefas().size() + (c.tarefas().size() == 1 ? ' tarefa' : ' tarefas')}"></span>
    </div>
    <form class="cap" method="post" th:action="@{/capacidade}">
      <input type="hidden" name="periodo" th:value="${c.periodo().codigo}">
      <span>Capacidade</span>
      <input type="number" name="horas" min="0" max="24" th:value="${c.capH()}" aria-label="Horas" th:disabled="${bloqueado}"><small>h</small>
      <input type="number" name="minutos" min="0" max="59" th:value="${c.capM()}" aria-label="Minutos" th:disabled="${bloqueado}"><small>min</small>
      <input type="number" name="segundos" min="0" max="59" th:value="${c.capS()}" aria-label="Segundos" th:disabled="${bloqueado}"><small>s</small>
      <button class="btn s" th:disabled="${bloqueado}">Salvar</button>
    </form>
    <div class="bar"><i th:style="${'width:' + c.percentual() + '%'}" th:classappend="${c.excesso() > 0} ? 'estouro'"></i></div>
    <div class="mu" th:text="${c.usadoFmt() + ' de ' + c.capacidadeFmt()}"></div>
    <div class="warn" th:if="${c.excesso() > 0}" th:text="${'Passou ' + c.excessoFmt() + ' da capacidade. Mova tarefas para outro turno.'}"></div>
    <div class="t" th:each="t : ${c.tarefas()}" th:classappend="${t.emAndamento()} ? 'rodando'">
      <b th:text="${t.nome()}"></b>
      <div class="tags"><span class="chip" th:text="${'⏱ ' + t.duracaoFmt()}"></span><span class="chip" th:text="${'Complexidade ' + t.comp().rotulo}"></span><span class="chip" th:text="${'Score ' + t.score()}"></span></div>
      <div class="tags"><span class="cont" th:attr="data-estado=${t.estado()},data-fim=${t.fimMs()},data-seg=${t.contadorSeg()}" title="Contador da tarefa">00:00:00</span></div>
      <div class="acts mini">
        <form method="post" th:action="@{/tarefas/{id}/iniciar(id=${t.id()})}" th:if="${!t.emAndamento()}"><input type="hidden" name="volta" value="/agenda"><button class="btn s" th:disabled="${ativa != null}">▶ Iniciar</button></form>
        <button type="button" class="btn s p" data-concluir th:attr="data-id=${t.id()},data-nome=${t.nome()},data-seg=${t.sugestaoGastoSeg(agora)}" th:disabled="${bloqueado and !ativa.id().equals(t.id())}">Concluir</button>
      </div>
      <form method="post" th:action="@{/tarefas/{id}/turno(id=${t.id()})}" class="mover"><small>Mover para</small><button class="mv" th:each="p : ${periodos}" name="periodo" th:value="${p.codigo}" th:classappend="${p == c.periodo()} ? 'on'" th:text="${p.icone}" th:title="${p.rotulo}" th:disabled="${bloqueado}"></button></form>
    </div>
    <p class="mu" th:if="${#lists.isEmpty(c.tarefas())}">Nenhuma tarefa neste turno.</p>
  </div>
</div>
</main>
<div th:replace="~{fragmentos :: rodape}"></div>
</body></html>
