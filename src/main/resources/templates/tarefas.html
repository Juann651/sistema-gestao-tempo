<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SGT</title><link rel="stylesheet" th:href="@{/style.css}"></head>
<body th:attr="data-agora=${agora}">
<header th:replace="~{fragmentos :: topo(${pagina})}"></header>
<main>
<div th:replace="~{fragmentos :: aviso}"></div>
<div th:replace="~{fragmentos :: faixaFoco}"></div>
<div class="grid">
  <form class="card" method="post" th:action="@{/tarefas}">
    <h2 th:text="${edit != null} ? 'Editando tarefa' : 'Nova tarefa'">Nova tarefa</h2>
    <p class="mu" th:if="${bloqueado}">🔒 Bloqueado enquanto o modo foco estiver ativo.</p>
    <fieldset th:disabled="${bloqueado}">
    <input type="hidden" name="id" th:value="${edit?.id()}">
    <label>Nome<input name="nome" required th:value="${edit?.nome()}"></label>
    <label>Descrição<input name="descricao" th:value="${edit?.descricao()}"></label>
    <div class="row2">
      <label>Prioridade<select name="prioridade"><option th:each="n : ${niveis}" th:value="${n.peso}" th:text="${n.rotulo}" th:selected="${edit != null ? edit.prioridade() == n.peso : n.name() == 'MEDIA'}"></option></select></label>
      <label>Urgência<select name="urgencia"><option th:each="n : ${niveis}" th:value="${n.peso}" th:text="${n.rotulo}" th:selected="${edit != null ? edit.urgencia() == n.peso : n.name() == 'MEDIA'}"></option></select></label>
      <label>Complexidade<select name="complexidade"><option th:each="n : ${niveis}" th:value="${n.peso}" th:text="${n.rotulo}" th:selected="${edit != null ? edit.complexidade() == n.peso : n.name() == 'MEDIA'}"></option></select></label>
      <label>Duração prevista (min)<input type="number" name="duracao" min="1" required th:value="${edit != null} ? ${edit.duracao()} : 60"></label>
    </div>
    <label>Turno<select name="periodo"><option th:each="p : ${periodos}" th:value="${p.codigo}" th:text="${p.rotulo}" th:selected="${edit != null ? edit.periodo() == p.codigo : p.name() == 'MANHA'}"></option></select></label>
    <div class="acts"><button class="btn p">Salvar tarefa</button><a class="btn" th:href="@{/}">Cancelar</a></div>
    </fieldset>
  </form>
  <div class="card">
    <h2>Suas tarefas</h2>
    <div class="contagem">
      <span class="pill n1" th:text="${total + (total == 1 ? ' cadastrada' : ' cadastradas')}"></span>
      <span class="pill n2" th:text="${pendentes + (pendentes == 1 ? ' pendente' : ' pendentes')}"></span>
      <span class="pill n1" th:text="${feitas + (feitas == 1 ? ' concluída' : ' concluídas')}"></span>
      <span class="pill gasto" th:text="${'esforço total ' + esforco}"></span>
    </div>
    <div class="mu">Ordenadas por score (prioridade × 2 + urgência × 3).</div>
    <p class="mu" th:if="${#lists.isEmpty(tarefas)}">Nenhuma tarefa ainda. Cadastre a primeira ao lado.</p>
    <div class="item" th:each="t : ${tarefas}" th:classappend="${t.concluida()} ? 'ok'">
      <div><b th:text="${t.nome()}"></b>
        <div class="tags">
          <span class="pill" th:style="${'background:' + t.turno().cor + '22;color:' + t.turno().cor}" th:text="${t.turno().rotulo}"></span>
          <span class="pill" th:classappend="${t.prio().css}" th:text="${t.prio().rotulo}"></span><span class="mu">prioridade</span>
          <span class="pill" th:classappend="${t.urg().css}" th:text="${t.urg().rotulo}"></span><span class="mu">urgência</span>
          <span class="pill" th:classappend="${t.scoreCss()}" th:text="${'score ' + t.score()}"></span>
          <span class="mu" th:text="${'previsto ' + t.duracaoFmt()}"></span>
          <span class="cont" th:attr="data-estado=${t.estado()},data-fim=${t.fimMs()},data-seg=${t.contadorSeg()}" title="Contador da tarefa">00:00:00</span>
          <span class="pill gasto" th:if="${t.concluida()}" th:text="${'esforço ' + t.gastoFmt() + (t.quemFez().isEmpty() ? '' : ' · ' + t.quemFez())}"></span>
        </div></div>
      <div class="acts">
        <form method="post" th:action="@{/tarefas/{id}/iniciar(id=${t.id()})}" th:if="${!t.concluida() and !t.emAndamento()}"><input type="hidden" name="volta" value="/"><button class="btn s" th:disabled="${ativa != null}" title="Inicia o contador e o modo foco">▶ Iniciar</button></form>
        <button type="button" class="btn s p" th:if="${!t.concluida()}" data-concluir th:attr="data-id=${t.id()},data-nome=${t.nome()},data-seg=${t.sugestaoGastoSeg(agora)}" th:disabled="${bloqueado and !ativa.id().equals(t.id())}">Concluir</button>
        <form method="post" th:action="@{/tarefas/{id}/reabrir(id=${t.id()})}" th:if="${t.concluida()}"><input type="hidden" name="volta" value="/"><button class="btn s" th:disabled="${bloqueado}">Reabrir</button></form>
        <a class="btn s" th:if="${!bloqueado}" th:href="@{/(editar=${t.id()})}">Editar</a><span class="btn s off" th:if="${bloqueado}">Editar</span>
        <form method="post" th:action="@{/tarefas/{id}/remover(id=${t.id()})}" onsubmit="return confirm('Remover esta tarefa?')"><button class="btn s d" th:disabled="${bloqueado}">Remover</button></form>
      </div>
    </div>
  </div>
</div>
</main>
<div th:replace="~{fragmentos :: rodape}"></div>
</body></html>
