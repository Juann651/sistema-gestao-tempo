server.port=${PORT:8080}
supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_KEY}
# Chave service_role (SÓ no servidor, nunca no navegador). Liga consistência, conquistas e painel admin.
supabase.service-key=${SUPABASE_SERVICE_KEY:}
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ---- Skill da Alexa (Amazon). Deixe ALEXA_SECRET e ALEXA_CLIENT_SECRET vazios para desligar. ----
alexa.secret=${ALEXA_SECRET:}
alexa.client-id=${ALEXA_CLIENT_ID:sgt-alexa}
alexa.client-secret=${ALEXA_CLIENT_SECRET:}
alexa.skill-id=${ALEXA_SKILL_ID:}
alexa.verificar=${ALEXA_VERIFICAR:true}
